
services:
  tiny-lsp-client-test:
    image: tiny-lsp-client-test
    # Uncommenting cpus below can be useful when testing the stability of the
    # tests
    # cpus: 0.5
    command: tail -F anything
    build:
      dockerfile: Dockerfile
    container_name: tiny-lsp-client-test
    init: true
    volumes:
      - ..:/tiny-lsp-client:rw
      # Mount separetely so that nix doesn't see the git repo. I run this repo
      # as a submodule, but the parent repo isn't seen inside the container
      # Move to /test, remove flake.lock, then run "nix flake lock" to update it
      - .:/test:rw
